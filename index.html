<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Email Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0f0f1a; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
    h1 { color: #4a9eff; font-size: 2rem; margin-bottom: 8px; }
    p.subtitle { color: #aaa; margin-bottom: 30px; }
    .card { background: #1a1a2e; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .card h2 { color: #4a9eff; margin-bottom: 16px; font-size: 1.1rem; }
    button { background: #1a56a0; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 6px; transition: background 0.2s; }
    button:hover { background: #2266c0; }
    button.danger { background: #a02020; }
    button.danger:hover { background: #c03030; }
    #status { background: #0d1117; border-radius: 8px; padding: 16px; font-size: 0.95rem; color: #7ee787; min-height: 60px; margin-top: 10px; white-space: pre-wrap; }
    #email-list { list-style: none; padding: 0; }
    #email-list li { background: #0d1117; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer; border-left: 3px solid #1a56a0; }
    #email-list li:hover { border-left-color: #4a9eff; }
    .mic-btn { background: #a0201a; font-size: 1.2rem; padding: 16px 32px; border-radius: 50px; }
    .mic-btn:hover { background: #c03030; }
  </style>
</head>
<body>
  <h1>🎙️ Voice Email Assistant</h1>
  <p class="subtitle">Fully hands-free email management for visually impaired users</p>

  <div class="card">
    <h2>Voice Command</h2>
    <button class="mic-btn" onclick="startListening()">🎤 Speak Command</button>
    <div id="status">Ready. Press the button and speak a command...</div>
  </div>

  <div class="card">
    <h2>Quick Actions</h2>
    <button onclick="readEmails()">📬 Read Inbox</button>
    <button onclick="composeEmail()">✍️ Compose Email</button>
    <button class="danger" onclick="deleteEmail()">🗑️ Delete Email</button>
  </div>

  <div class="card">
    <h2>Inbox</h2>
    <ul id="email-list"><li>Loading emails...</li></ul>
  </div>

  <script>
    let currentEmailIndex = 0;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function startListening() {
      setStatus("Listening for your command...");
      try {
        const res = await fetch('/listen', { method: 'POST' });
        const data = await res.json();
        setStatus(`Heard: "${data.command}"\nIntent: ${data.intent}`);
        handleIntent(data.intent, data.command);
      } catch (e) {
        setStatus("Error: Could not connect to voice server.");
      }
    }

    function handleIntent(intent, command) {
      if (intent === 'inbox' || intent === 'read') readEmails();
      else if (intent === 'compose') composeEmail();
      else if (intent === 'delete') deleteEmail();
      else setStatus(`Command received: "${command}". Please try: read, compose, delete, or inbox.`);
    }

    async function readEmails() {
      setStatus("Fetching and reading your inbox...");
      try {
        const res = await fetch('/read_emails');
        const data = await res.json();
        const list = document.getElementById('email-list');
        list.innerHTML = '';
        data.emails.forEach((email, i) => {
          const li = document.createElement('li');
          li.textContent = email;
          li.onclick = () => readSingleEmail(i);
          list.appendChild(li);
        });
        setStatus(`Found ${data.emails.length} emails. Reading aloud...`);
      } catch (e) {
        setStatus("Error fetching emails.");
      }
    }

    async function readSingleEmail(id) {
      setStatus(`Reading email ${id + 1}...`);
      const res = await fetch(`/read_email/${id}`);
      const data = await res.json();
      setStatus(`Reading: ${data.body}\n\nImage captions: ${data.image_captions.join(', ') || 'None'}`);
      currentEmailIndex = id;
    }

    async function composeEmail() {
      const to = prompt("Enter recipient email address:");
      const subject = prompt("Enter email subject:");
      const body = prompt("Enter email body:");
      if (!to || !subject || !body) return;
      setStatus("Sending email...");
      const res = await fetch('/compose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, subject, body })
      });
      const data = await res.json();
      setStatus(data.success ? "Email sent successfully!" : "Failed to send email.");
    }

    async function deleteEmail() {
      setStatus(`Deleting email ${currentEmailIndex + 1}...`);
      const res = await fetch('/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email_id: currentEmailIndex })
      });
      const data = await res.json();
      setStatus(data.success ? "Email deleted." : "Could not delete email.");
      if (data.success) readEmails();
    }

    window.onload = readEmails;
  </script>
</body>
</html>
